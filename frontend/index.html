<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invo — WhatsApp Inventory Agent</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="nav">
  <a href="index.html">Chat</a>
  <a href="dashboard.html">Dashboard</a>
</div>

<!-- ============ the phone ============ -->
<div class="phone">
  <div class="notch"></div>

  <div class="wa-header">
    <div class="avatar">🛒</div>
    <div class="who">
      <div class="name">Invo</div>
      <div class="status">online</div>
    </div>
    <div class="icons">⋮</div>
  </div>

  <div class="chat" id="chat">
    <div class="daypill">TODAY</div>
  </div>

  <div class="chips" id="chips"></div>

  <div class="composer">
    <input id="input" placeholder="Message" autocomplete="off">
    <button id="mic"  title="Send a voice note">🎙</button>
    <button id="send" title="Send">➤</button>
    <input type="file" id="audiofile" accept="audio/*" hidden>
  </div>
</div>

<!-- ============ live stock, beside the phone ============ -->
<div class="side">
  <h1>Sharma Kirana Store</h1>
  <div class="sub">Live stock — updates as the chat does</div>

  <div class="stats" id="stats"></div>

  <div class="card" style="margin-top:13px">
    <h2>Needs reordering</h2>
    <div id="alerts"></div>
  </div>

  <div class="card">
    <h2>Stock</h2>
    <table>
      <thead><tr><th>Item</th><th class="num">Qty</th><th class="num">Days left</th><th></th></tr></thead>
      <tbody id="stock"></tbody>
    </table>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
