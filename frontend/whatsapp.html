<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invo — WhatsApp mirror</title>
<link rel="stylesheet" href="styles.css">
<style>
  .mirror-note { padding: 14px; text-align: center; font-size: 12px; color: var(--wa-muted); background: #111b21; border-top: 1px solid #1f2c34; }
</style>
</head>
<body>

<div class="nav">
  <a href="index.html">Chat</a>
  <a href="whatsapp.html">WhatsApp</a>
  <a href="dashboard.html">Dashboard</a>
</div>

<!-- ============ the phone ============ -->
<div class="phone">
  <div class="notch"></div>

  <div class="wa-header">
    <div class="avatar">🛒</div>
    <div class="who">
      <div class="name">Invo</div>
      <div class="status" id="who">WhatsApp · waiting for messages…</div>
    </div>
    <div class="icons">⋮</div>
  </div>

  <div class="chat" id="chat">
    <div class="daypill">TODAY</div>
  </div>

  <div class="mirror-note">Live, read-only mirror of the WhatsApp chat</div>
</div>

<!-- ============ live stock, beside the phone ============ -->
<div class="side">
  <h1>Sharma Kirana Store</h1>
  <div class="sub">Live stock — updates as WhatsApp messages arrive</div>

  <div class="stats" id="stats"></div>

  <div class="card" style="margin-top:13px">
    <h2>Needs reordering</h2>
    <div id="alerts"></div>
  </div>

  <div class="card">
    <h2>Stock</h2>
    <table>
      <thead><tr><th>Item</th><th class="num">Qty</th><th class="num">Days left</th><th></th></tr></thead>
      <tbody id="stock"></tbody>
    </table>
  </div>
</div>

<script src="whatsapp.js"></script>
</body>
</html>
